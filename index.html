<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jorge & Astrid - Libro AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #inicio { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10000; background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8)), url('fondo.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
    #btn-comenzar { border: 0; padding: 16px 40px; background: #2563eb; color: white; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; }
    
    #video-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 20000; display: none; background: #000; }
    #video-pantalla { width: 100%; height: 100%; object-fit: cover; }
    
    /* El botón tiene prioridad total y está fuera de la escena */
    #btn-cerrar { position: fixed; top: 30px; right: 30px; z-index: 30000; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  </style>
</head>
<body>

  <div id="inicio"><button id="btn-comenzar">Comenzar Experiencia</button></div>

  <div id="video-container">
    <button id="btn-cerrar">&#10005;</button>
    <video id="video-pantalla" playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-group"></a-entity>
  </a-scene>

  <script>
    const container = document.getElementById('video-container');
    const video = document.getElementById('video-pantalla');
    const btnCerrar = document.getElementById('btn-cerrar');
    const sceneEl = document.querySelector('a-scene');

    let videoActual = null;

    // Lógica para cerrar el video
    function cerrarTodo(e) {
      if(e) { e.preventDefault(); e.stopPropagation(); }
      video.pause();
      video.currentTime = 0;
      container.style.display = 'none';
      // Reactiva la detección de la escena al cerrar
      sceneEl.play();
    }

    btnCerrar.addEventListener('click', cerrarTodo);
    btnCerrar.addEventListener('touchend', cerrarTodo);

    document.getElementById('btn-comenzar').addEventListener('click', () => {
      document.getElementById('inicio').style.display = 'none';
      sceneEl.systems['mindar-image-system'].start();
    });

    // Eventos al detectar imagen
    document.getElementById('targets-group').addEventListener('targetFound', (e) => {
      // Pausa la escena para que no siga procesando mientras vemos el video
      sceneEl.pause();
      container.style.display = 'block';
      // (Aquí iría la lógica de obtenerRuta igual que antes)
      video.play();
    });
  </script>
</body>
</html>
